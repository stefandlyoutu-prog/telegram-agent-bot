<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0f1412" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BP Survey" />
    <meta name="description" content="Замерщик BestPaints: площади, технология, смета и PDF на объекте" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icon.svg" />
    <title>BestPaints Survey — замерщик</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="stylesheet" href="./css/styles.css?v=62" />
  </head>
  <body>
    <div class="app" id="app">
      <p style="color:#9aada2;padding:24px">Загрузка…</p>
    </div>
    <script type="module" src="./js/app.js?v=62"></script>
    <script>
      if ("serviceWorker" in navigator) {
        // Без location.reload(): иначе при деплое/обновлении SW стирается форма сделки.
        // Новый кэш подхватывается network-first + skipWaiting.
        navigator.serviceWorker.register("./sw.js?v=62").then(function (reg) {
          reg.update();
          if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
          reg.addEventListener("updatefound", function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener("statechange", function () {
              if (nw.state === "installed" && navigator.serviceWorker.controller) {
                nw.postMessage({ type: "SKIP_WAITING" });
              }
            });
          });
        }).catch(function () {});
      }
    </script>
  </body>
</html>
