<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#0f1412" />
    <title>Вход · BestPaints Survey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0f1412;
        --surface: #1e2823;
        --line: rgba(196, 163, 90, 0.25);
        --accent: #c4a35a;
        --text: #f5f0e6;
        --muted: #9aada2;
        --danger: #e07a6a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: radial-gradient(1200px 600px at 20% 0%, #24302a, var(--bg));
        color: var(--text); font-family: Manrope, system-ui, sans-serif; padding: 24px;
      }
      .card {
        width: min(100%, 420px); background: linear-gradient(160deg, #26312b, #1e2823);
        border: 1px solid var(--line); border-radius: 18px; padding: 28px 24px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      }
      .brand { font-family: Unbounded, Manrope, sans-serif; font-size: 1.15rem; margin: 0 0 4px; }
      .sub { color: var(--muted); margin: 0 0 22px; font-size: 0.92rem; line-height: 1.4; }
      label { display: block; font-size: 0.8rem; color: var(--muted); margin: 0 0 6px; }
      input {
        width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
        background: #151c19; color: var(--text); font: inherit; margin-bottom: 14px;
      }
      input:focus { outline: 2px solid rgba(196,163,90,0.45); border-color: var(--accent); }
      button {
        width: 100%; margin-top: 8px; padding: 14px; border: none; border-radius: 12px;
        background: var(--accent); color: #1a1408; font-weight: 800; font-size: 1rem; cursor: pointer;
      }
      .err { color: var(--danger); font-size: 0.88rem; margin: 0 0 12px; min-height: 1.2em; }
      .foot { margin-top: 18px; font-size: 0.78rem; color: var(--muted); text-align: center; }
      .foot a { color: var(--accent); }
    </style>
  </head>
  <body>
    <form class="card" method="post" action="/bestpaints/login" autocomplete="on">
      <h1 class="brand">BestPaints Survey</h1>
      <p class="sub">Закрытый вход для замерщиков и руководства. Данные объектов хранятся на вашем устройстве.</p>
      <p class="err" id="err"></p>
      <label for="username">Логин</label>
      <input id="username" name="username" required autocomplete="username" placeholder="логин" />
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="пароль" />
      <button type="submit">Войти →</button>
      <p class="foot"><a href="https://moracul.ru/">moracul.ru</a> · внутренний инструмент</p>
    </form>
    <p class="hint" style="margin-top:16px;font-size:13px;opacity:.75">
      Если сайт не открывается: попробуйте
      <a href="https://moracul.onrender.com/bestpaints/">зеркало moracul.onrender.com</a>
      или отключите/включите VPN. Обучение:
      <a href="/bestpaints/docs/BestPaints_Obuchenie_v5.pdf?v=20260728a">PDF</a>
    </p>

    <script>
      const q = new URLSearchParams(location.search);
      if (q.get("e") === "1") {
        document.getElementById("err").textContent = "Неверный логин или пароль.";
      }
    </script>
  </body>
</html>
